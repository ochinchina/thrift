apply plugin: 'java'
apply plugin: 'maven-publish'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
    test {
        java {
            srcDir 'test'
        }
    }
}


dependencies {
    implementation(
            "org.apache.commons:commons-lang3:3.16.0",
            "org.slf4j:slf4j-api:2.0.16",
            "io.netty:netty-all:4.1.112.Final",
            "javax.servlet:javax.servlet-api:4.0.1",
            //"org.apache.httpcomponents.core5:httpcore5:5.2.5",
            //"org.apache.httpcomponents.client5:httpclient5:5.3.1",
            "org.apache.httpcomponents.client5:httpclient5-fluent:5.3.1"
    )

    testImplementation(
            'org.junit.jupiter:junit-jupiter-api:5.11.0',
            'org.hamcrest:java-hamcrest:2.0.0.0',
    )

}


java {
    withSourcesJar()
}


version = '0.8.7'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId 'org.apache.thrift'
            artifactId 'thrift'
        }
    }
}
